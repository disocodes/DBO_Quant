# Minimal API gateway. The user-facing UI remains OpenBB Workspace.
command:
  - sh
  - -c
  - 'openbb-build && openbb-api --app app.py --apps-json ./workspace_apps.json --host 0.0.0.0 --port "$DATABRICKS_APP_PORT"'

env:
  # Add a SQL warehouse as an App resource with resource key: sql_warehouse
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql_warehouse
  - name: FINANCE_CATALOG
    value: REPLACE_WITH_CATALOG
  - name: FINANCE_SCHEMA
    value: openbb_quant

  # Add the three Lakeflow Jobs as App resources with CAN MANAGE RUN.
  - name: BACKTEST_JOB_ID
    valueFrom: backtest_job
  - name: MONTE_CARLO_JOB_ID
    valueFrom: monte_carlo_job
  - name: COMPARISON_JOB_ID
    valueFrom: comparison_job

  # Provider keys are intentionally NOT hard-coded here. Add Databricks Secret resources
  # to the App and map them to FMP_API_KEY, FRED_API_KEY, INTRINIO_API_KEY, etc.

  # Hosted Workspace origin. Add comma-separated enterprise/self-hosted origins if needed.
  - name: OPENBB_ALLOWED_ORIGINS
    value: https://pro.openbb.co
