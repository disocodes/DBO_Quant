# DBO_Quant OpenBB API App
# First deployment requires only a SQL Warehouse resource.
command:
  - sh
  - -c
  - 'openbb-build && openbb-api --app app_entry.py --apps-json ./workspace_apps.json --host 0.0.0.0 --port "$DATABRICKS_APP_PORT"'

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql_warehouse

  - name: FINANCE_CATALOG
    value: REPLACE_WITH_YOUR_CATALOG
  - name: FINANCE_SCHEMA
    value: openbb_quant

  # Optional production Job IDs. Manual notebooks work without these.
  - name: BACKTEST_JOB_ID
    value: ""
  - name: MONTE_CARLO_JOB_ID
    value: ""
  - name: COMPARISON_JOB_ID
    value: ""

  - name: OPENBB_ALLOWED_ORIGINS
    value: https://pro.openbb.co
