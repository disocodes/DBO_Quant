[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-databricks-quant-platform"
version = "0.1.0"
description = "Strategy-agnostic backtesting, Monte Carlo and comparison utilities for the Databricks + OpenBB quant platform"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
